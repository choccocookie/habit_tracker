{% extends 'base.html' %}

{% block title %}Добавить привычку{% endblock %}

{% block content %}
    <h2>Добавить привычку</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="action">Действие</label>
            <input type="text" id="action" name="action" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="time">Время</label>
            <input type="text" id="time" name="time" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="place">Место</label>
            <input type="text" id="place" name="place" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Добавить привычку</button>
    </form>
{% endblock %}
